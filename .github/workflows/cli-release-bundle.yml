name: CLI release bundle

on:
  workflow_call:
    inputs:
      build-script:
        description: Path to the portable bundle build script.
        required: false
        type: string
        default: scripts/release/build_portable_bundle.sh
      checkout-ref:
        description: Git ref to build. Defaults to the workflow ref.
        required: false
        type: string
        default: ''
      release-tag:
        description: GitHub Release tag to receive the assets. Defaults to the workflow ref name.
        required: false
        type: string
        default: ''
      linux-runner:
        description: JSON array of labels for the Linux runner.
        required: false
        type: string
        default: '["self-hosted", "Linux", "X64"]'
      macos-runner:
        description: JSON array of labels for the macOS runner.
        required: false
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'

permissions:
  contents: write

concurrency:
  group: cli-release-bundle-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    name: Linux x64 bundle
    runs-on: ${{ fromJSON(inputs.linux-runner) }}
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - name: Set up Ruby with rbenv
        shell: bash
        run: |
          export RBENV_ROOT="${RBENV_ROOT:-${HOME}/.rbenv}"
          export PATH="${RBENV_ROOT}/plugins/ruby-build/bin:${RBENV_ROOT}/bin:${PATH}"
          command -v rbenv >/dev/null || {
            echo "rbenv is required on the Linux self-hosted runner" >&2
            exit 1
          }
          eval "$(rbenv init - bash)"
          ruby_version="$(tr -d '[:space:]' < .ruby-version)"
          if ! rbenv install --list | grep -Fxq "${ruby_version}"; then
            ruby_build_plugin="${RBENV_ROOT}/plugins/ruby-build"
            test -d "${ruby_build_plugin}" || {
              echo "ruby-build plugin is missing under ${ruby_build_plugin}" >&2
              exit 1
            }
            git -C "${ruby_build_plugin}" pull --ff-only
          fi
          rbenv install -s "${ruby_version}"
          rbenv shell "${ruby_version}"
          ruby_bin="$(rbenv which ruby)"
          test "$(${ruby_bin} --disable-gems -e 'print RUBY_VERSION')" = "${ruby_version}"
          echo "OPSD_RUBY_BIN=${ruby_bin}" >> "${GITHUB_ENV}"
      - name: Run unit tests
        run: |
          RUBY_BIN="${OPSD_RUBY_BIN}" "${OPSD_RUBY_BIN}" -Ilib:test -e 'Dir["test/*_test.rb"].sort.each { |f| load f }'
      - name: Build bundle
        run: ${{ inputs.build-script }}
      - name: Generate checksum
        shell: bash
        run: |
          bundle=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          bundle_name=${bundle##*/}
          sha256sum "$bundle" > "dist/${bundle_name}.sha256"
      - name: Wait for GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          attempt=1
          while ! gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1 && [ "$attempt" -le 12 ]; do
            attempt=$((attempt + 1))
            sleep 5
          done
          gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1 && exit 0
          echo "GitHub Release ${RELEASE_TAG} was not found" >&2
          exit 1
      - name: Upload release assets
        env:
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.release-tag || github.ref_name }}" --repo "${GH_REPO}" dist/*.tar.gz dist/*.sha256 --clobber

  macos:
    name: macOS ARM64 bundle
    runs-on: ${{ fromJSON(inputs.macos-runner) }}
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
      - name: Set up Ruby with rbenv
        shell: bash
        run: |
          export RBENV_ROOT="${RBENV_ROOT:-${HOME}/.rbenv}"
          export PATH="${RBENV_ROOT}/plugins/ruby-build/bin:${RBENV_ROOT}/bin:${PATH}"
          command -v rbenv >/dev/null || {
            echo "rbenv is required on the macOS self-hosted runner" >&2
            exit 1
          }
          eval "$(rbenv init - bash)"
          ruby_version="$(tr -d '[:space:]' < .ruby-version)"
          rbenv install -s "${ruby_version}"
          rbenv shell "${ruby_version}"
          ruby_bin="$(rbenv which ruby)"
          test "$(${ruby_bin} --disable-gems -e 'print RUBY_VERSION')" = "${ruby_version}"
          echo "OPSD_RUBY_BIN=${ruby_bin}" >> "${GITHUB_ENV}"
      - name: Run unit tests
        run: |
          RUBY_BIN="${OPSD_RUBY_BIN}" "${OPSD_RUBY_BIN}" -Ilib:test -e 'Dir["test/*_test.rb"].sort.each { |f| load f }'
      - name: Build bundle
        run: ${{ inputs.build-script }}
      - name: Generate checksum
        shell: bash
        run: |
          bundle=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          bundle_name=${bundle##*/}
          shasum -a 256 "$bundle" > "dist/${bundle_name}.sha256"
      - name: Wait for GitHub Release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          attempt=1
          while ! gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1 && [ "$attempt" -le 12 ]; do
            attempt=$((attempt + 1))
            sleep 5
          done
          gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1 && exit 0
          echo "GitHub Release ${RELEASE_TAG} was not found" >&2
          exit 1
      - name: Upload release assets
        env:
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ inputs.release-tag || github.ref_name }}" --repo "${GH_REPO}" dist/*.tar.gz dist/*.sha256 --clobber
