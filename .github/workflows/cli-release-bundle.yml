name: CLI release bundle

on:
  workflow_call:
    inputs:
      build-script:
        description: Path to the portable bundle build script.
        required: false
        type: string
        default: scripts/release/build_portable_bundle.sh
      linux-runner:
        description: JSON array of labels for the Linux runner.
        required: false
        type: string
        default: '["self-hosted", "Linux", "X64"]'
      macos-runner:
        description: JSON array of labels for the macOS runner.
        required: false
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'

permissions:
  contents: write

concurrency:
  group: cli-release-bundle-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  linux:
    name: Linux x64 bundle
    runs-on: ${{ fromJSON(inputs.linux-runner) }}
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Run unit tests
        run: sh scripts/ci/run_unit_cli_tests.sh
      - name: Build bundle
        run: ${{ inputs.build-script }}
      - name: Generate checksum
        shell: bash
        run: |
          bundle=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          bundle_name=${bundle##*/}
          sha256sum "$bundle" > "dist/${bundle_name}.sha256"
      - name: Wait for GitHub Release
        shell: bash
        run: |
          attempt=1
          while ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && [ "$attempt" -le 12 ]; do
            attempt=$((attempt + 1))
            sleep 5
          done
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && exit 0
          echo "GitHub Release ${GITHUB_REF_NAME} was not found" >&2
          exit 1
      - name: Upload release assets
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --clobber

  macos:
    name: macOS ARM64 bundle
    runs-on: ${{ fromJSON(inputs.macos-runner) }}
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30af803 # v6
      - name: Verify runner Ruby
        shell: bash
        env:
          OPSD_MACOS_RUBY_BIN: ${{ vars.OPSD_MACOS_RUBY_BIN }}
        run: |
          test -n "${OPSD_MACOS_RUBY_BIN}" || {
            echo "OPSD_MACOS_RUBY_BIN repository or organization variable is required" >&2
            exit 1
          }
          test -x "${OPSD_MACOS_RUBY_BIN}" || {
            echo "Ruby executable does not exist: ${OPSD_MACOS_RUBY_BIN}" >&2
            exit 1
          }
          test "$(${OPSD_MACOS_RUBY_BIN} --disable-gems -e 'print RUBY_VERSION')" = "$(tr -d '[:space:]' < .ruby-version)"
      - name: Run unit tests
        env:
          OPSD_MACOS_RUBY_BIN: ${{ vars.OPSD_MACOS_RUBY_BIN }}
        run: |
          "${OPSD_MACOS_RUBY_BIN}" -Ilib:test -e 'Dir["test/*_test.rb"].sort.each { |f| load f }'
      - name: Build bundle
        env:
          OPSD_RUBY_BIN: ${{ vars.OPSD_MACOS_RUBY_BIN }}
        run: ${{ inputs.build-script }}
      - name: Generate checksum
        shell: bash
        run: |
          bundle=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)
          bundle_name=${bundle##*/}
          shasum -a 256 "$bundle" > "dist/${bundle_name}.sha256"
      - name: Wait for GitHub Release
        shell: bash
        run: |
          attempt=1
          while ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && [ "$attempt" -le 12 ]; do
            attempt=$((attempt + 1))
            sleep 5
          done
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && exit 0
          echo "GitHub Release ${GITHUB_REF_NAME} was not found" >&2
          exit 1
      - name: Upload release assets
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --clobber
