name: OPSd public infrastructure plan

on:
  workflow_call:
    inputs:
      compatibility-file:
        description: Path to the CLI compatibility and scenario matrix file.
        required: false
        type: string
        default: ci/public-compatibility.yaml
      terraform-version:
        description: Terraform version to use for the plan.
        required: false
        type: string
        default: 1.15.7
      opentofu-version:
        description: OpenTofu version to use for the plan.
        required: false
        type: string
        default: 1.12.6
      integration-tests-repository:
        description: Public repository containing the scenario matrix and runner.
        required: false
        type: string
        default: opsd-io/integration-tests
      integration-tests-ref:
        description: Git ref of the integration test suite.
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  matrix:
    name: Generate compatibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out CLI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out integration tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.integration-tests-repository }}
          ref: ${{ inputs.integration-tests-ref }}
          path: integration-tests

      - name: Set up Ruby
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: .ruby-version
          bundler: none

      - name: Build matrix
        id: matrix
        env:
          COMPATIBILITY_FILE: integration-tests/${{ inputs.compatibility-file }}
        run: |
          ruby integration-tests/scripts/generate_matrix.rb >> "${GITHUB_OUTPUT}"

  plan:
    name: ${{ matrix.provider }} / ${{ matrix.scenario }} / ${{ matrix.iac_tool }}
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Check out CLI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.cli_ref }}

      - name: Check out integration tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.integration-tests-repository }}
          ref: ${{ inputs.integration-tests-ref }}
          path: integration-tests

      - name: Set up Ruby
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          ruby-version: .ruby-version
          bundler: none

      - name: Set up Terraform
        if: matrix.iac_tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Set up OpenTofu
        if: matrix.iac_tool == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ inputs.opentofu-version }}

      - name: Run CLI scenario
        env:
          OPSD_PUBLIC_SCENARIO: ${{ matrix.scenario }}
          OPSD_PUBLIC_MODULES_REF: ${{ matrix.modules_ref }}
          OPSD_PUBLIC_IAC_TOOL: ${{ matrix.iac_tool }}
          OPSD_PUBLIC_COMPATIBILITY_FILE: integration-tests/${{ inputs.compatibility-file }}
          OPSD_CLI_ROOT: ${{ github.workspace }}
        run: ruby integration-tests/scripts/run_scenario.rb
