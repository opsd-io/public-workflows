name: Release Please

on:
  workflow_call:
    inputs:
      release-type:
        description: Release Please release strategy, for example simple, ruby, or terraform-module.
        required: false
        type: string
        default: simple
      version-file:
        description: Version file used by release strategies that update source versions.
        required: false
        type: string
        default: ''
      component:
        description: Component name used by release strategies with component-based defaults.
        required: false
        type: string
        default: ''
      config-file:
        description: Path to the repository-specific Release Please configuration.
        required: false
        type: string
        default: release-please-config.json
      manifest-file:
        description: Path to the repository-specific Release Please manifest.
        required: false
        type: string
        default: .release-please-manifest.json
      target-branch:
        description: Branch receiving the release PR.
        required: false
        type: string
        default: main
      publish-bundle:
        description: Build and publish CLI bundles after a release is created.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.repository }}-${{ inputs.target-branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR or GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create shared Release Please configuration
        if: ${{ inputs.config-file == 'release-please-config.json' }}
        shell: bash
        run: |
          cat > "${{ inputs.config-file }}" <<'EOF'
          {
            "release-type": "${{ inputs.release-type }}",
            "version-file": "${{ inputs.version-file }}",
            "component": "${{ inputs.component }}",
            "exclude-paths": [
              ".github/workflows"
            ],
            "changelog-sections": [
              { "type": "feat", "section": "🚀 Features" },
              { "type": "fix", "section": "🐛 Fixes" },
              { "type": "perf", "section": "⚡ Performance" },
              { "type": "docs", "section": "📚 Documentation" },
              { "type": "deps", "section": "📦 Dependencies" },
              { "type": "refactor", "section": "🧹 Refactoring" },
              { "type": "chore", "section": "🔧 Maintenance" }
            ],
            "packages": {
              ".": {
                "release-type": "${{ inputs.release-type }}",
                "version-file": "${{ inputs.version-file }}",
                "component": "${{ inputs.component }}"
              }
            }
          }
          EOF

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          release-type: ${{ inputs.release-type }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          target-branch: ${{ inputs.target-branch }}

      - name: Update source version file
        if: ${{ steps.release.outputs.pr != '' && inputs.version-file != '' }}
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          set -euo pipefail

          release_branch="$(jq -r '.headBranchName // empty' <<<"${RELEASE_PR}")"
          release_version="$(jq -r '.version // empty' <<<"${RELEASE_PR}")"

          if [[ -z "${release_branch}" || -z "${release_version}" ]]; then
            echo "Release Please did not return a release PR branch and version."
            exit 1
          fi

          git fetch origin "${release_branch}"
          git checkout -B "${release_branch}" "origin/${release_branch}"

          ruby - "${VERSION_FILE}" "${release_version}" <<'RUBY'
          path, version = ARGV
          content = File.read(path)
          updated = content.sub(
            /(VERSION\s*=\s*["'])\d+\.\d+\.\d+(?:-[\w.]+)?(?:\+[\w.-]+)?(["'])/,
            "\\1#{version}\\2"
          )
          abort "Could not find a Ruby VERSION assignment in #{path}" if updated == content
          File.write(path, updated)
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${VERSION_FILE}"
          git commit -m "chore: update source version to ${release_version}"
          git push origin "HEAD:${release_branch}"

  bundle:
    if: ${{ inputs.publish-bundle && needs.release.outputs.release_created == 'true' }}
    needs: release
    uses: ./.github/workflows/cli-release-bundle.yml
    with:
      checkout-ref: ${{ needs.release.outputs.tag_name }}
      release-tag: ${{ needs.release.outputs.tag_name }}
